name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Frameworks
        run: |
          chmod +x ./downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Build and Package Unsigned IPA
        run: |
          set -e
          mkdir -p "$PWD/build/diagnostics" "$PWD/build/ipa"

          COMMON_ARGS=(
            -project Code.xcodeproj
            -scheme "Code App"
            -configuration Release
            -sdk iphoneos
            -destination 'generic/platform=iOS'
            -derivedDataPath "$PWD/build/DerivedData"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            DEVELOPMENT_TEAM=
          )

          # Build the app ignoring signing requirements
          xcodebuild "${COMMON_ARGS[@]}" build

          # Extract paths dynamically from Xcode's build settings
          xcodebuild "${COMMON_ARGS[@]}" -showBuildSettings > "$PWD/build/diagnostics/build-settings.txt"
          TARGET_BUILD_DIR=$(awk -F' = ' '/ TARGET_BUILD_DIR = / { value=$2 } END { print value }' "$PWD/build/diagnostics/build-settings.txt")
          WRAPPER_NAME=$(awk -F' = ' '/ WRAPPER_NAME = / { value=$2 } END { print value }' "$PWD/build/diagnostics/build-settings.txt")
          APP_PATH="$TARGET_BUILD_DIR/$WRAPPER_NAME"

          echo "TARGET_BUILD_DIR=$TARGET_BUILD_DIR"
          echo "WRAPPER_NAME=$WRAPPER_NAME"
          echo "APP_PATH=$APP_PATH"
          
          # Fallback check in case the app path differs
          find "$PWD/build" -maxdepth 8 -type d -name '*.app' -print > "$PWD/build/diagnostics/app-bundles.txt" || true

          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(sed -n '1p' "$PWD/build/diagnostics/app-bundles.txt")
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "No .app bundle found. Known app bundles:"
            cat "$PWD/build/diagnostics/app-bundles.txt"
            exit 1
          fi

          echo "Packaging $APP_PATH"
          rm -rf "$PWD/build/Payload"
          mkdir -p "$PWD/build/Payload"
          
          # Copy the .app bundle and securely package it using ditto
          cp -R "$APP_PATH" "$PWD/build/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$PWD/build/Payload" "$PWD/build/ipa/CodeApp-unsigned.ipa"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-unsigned-ipa
          path: build/ipa/CodeApp-unsigned.ipa
          if-no-files-found: error

      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-build-diagnostics
          path: build/diagnostics
          if-no-files-found: ignore
